<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Platte als Favicon: durchsichtig, passt sich an helles/dunkles Browser-Tab an -->
  <style>
    :root { --stroke: #0A0A0A; }
    @media (prefers-color-scheme: dark) { :root { --stroke: #E6E6E2; } }
  </style>
  <circle cx="16" cy="16" r="14.5" fill="none" stroke="var(--stroke)" stroke-width="2"/>   <!-- äußerer Rand -->
  <circle cx="16" cy="16" r="9.5"  fill="none" stroke="var(--stroke)" stroke-width="1" opacity="0.6"/> <!-- eine feine Rille -->
  <circle cx="16" cy="16" r="5.5"  fill="var(--stroke)"/>                                   <!-- Etikett, ausgefüllt -->
</svg>
